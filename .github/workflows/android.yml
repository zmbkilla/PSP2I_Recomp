# Builds the Android APK (port/android): the psprecomp runtime, the SDL3 host,
# SDL3 and the ATRAC decoder, for arm64-v8a.
#
# The game's generated C (port/gen) is derived from the EBOOT and is not in
# the repository, so this APK cannot start the game by itself: it checks that
# the Android build works and that everything except the game code compiles
# and links. A playable APK is built locally with port/gen present (see
# port/android/README.md).

name: Android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4     # caches; the build itself runs the repository's wrapper

      - name: Build the APK
        working-directory: port/android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # the SDL release lookup, without the anonymous rate limit
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # The errors as an annotation on the run, readable without the full log.
      - name: Report build errors
        if: failure()
        working-directory: port/android
        run: |
          msg=$(grep -E "error:|error [A-Z]+[0-9]+|undefined reference|FAILED|What went wrong|Could not|Exception" -A2 build.log | head -80 \
                | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Android build errors::${msg:-no error lines found; see the log}"

      - uses: actions/upload-artifact@v4
        with:
          name: psp2i-android-no-game-code
          path: port/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
